<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Dessin du village de l'événement avec stands, buvette et scène de concert au bord de l'eau">
  <rect width="600" height="400" fill="#0d2a4a"/>
  <!-- étoiles / soirée -->
  <g fill="#fff"><circle cx="80" cy="50" r="2"/><circle cx="200" cy="34" r="1.6"/><circle cx="420" cy="44" r="2"/><circle cx="540" cy="70" r="1.6"/></g>
  <!-- guirlande -->
  <path d="M0 90 Q150 140 300 90 T600 90" fill="none" stroke="#fff" stroke-width="2"/>
  <g fill="#f2994a">
    <circle cx="60" cy="108" r="6"/><circle cx="150" cy="118" r="6"/><circle cx="240" cy="104" r="6"/>
    <circle cx="360" cy="104" r="6"/><circle cx="450" cy="118" r="6"/><circle cx="540" cy="108" r="6"/>
  </g>
  <!-- sol -->
  <rect y="300" width="600" height="100" fill="#1e4d3a"/>
  <!-- stands -->
  <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30 200 L80 160 L130 200 Z" fill="#1e4d3a"/>
    <rect x="40" y="200" width="80" height="100"/>
    <line x1="40" y1="236" x2="120" y2="236"/>
    <path d="M150 200 L200 160 L250 200 Z" fill="#1e4d3a"/>
    <rect x="160" y="200" width="80" height="100"/>
    <line x1="160" y1="236" x2="240" y2="236"/>
    <!-- gobelet buvette -->
    <path d="M190 252 L210 252 L206 280 L194 280 Z"/>
  </g>
  <!-- scène -->
  <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M300 300 L300 170 Q430 130 560 170 L560 300"/>
    <line x1="290" y1="300" x2="570" y2="300"/>
    <rect x="300" y="276" width="260" height="24" fill="#0d2a4a"/>
    <!-- platine DJ -->
    <rect x="390" y="236" width="80" height="40"/>
    <circle cx="412" cy="248" r="8"/><circle cx="448" cy="248" r="8"/>
    <circle cx="430" cy="220" r="10"/>
    <!-- notes -->
    <path d="M500 200 v-26 l18 -6 v26"/><circle cx="496" cy="202" r="5" fill="#fff"/><circle cx="514" cy="196" r="5" fill="#fff"/>
  </g>
  <!-- public -->
  <g fill="#0d2a4a" stroke="#fff" stroke-width="2.5">
    <circle cx="340" cy="334" r="10"/><circle cx="380" cy="340" r="10"/><circle cx="430" cy="332" r="10"/>
    <circle cx="480" cy="342" r="10"/><circle cx="530" cy="334" r="10"/>
  </g>
</svg>
