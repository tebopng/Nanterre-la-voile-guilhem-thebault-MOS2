    <path d="M30 300 q18 -7 36 0 t36 0"/><path d="M460 290 q18 -7 36 0 t36 0"/><path d="M300 370 q18 -7 36 0 t36 0"/>
  </g>
  <!-- bateau 1 -->
  <g fill="none" stroke="#0d2a4a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
